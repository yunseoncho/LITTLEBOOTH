<title>리틀부스 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: 기기별 셸 — PC: 펼친 사이드바 250 / 태블릿: 아이콘 레일 72 + 2단 POS / 모바일: 상단바 + 하단 탭 + 주문 시트. 라이트 전용 */
:root{
  --bg:#ffffff; --fg:#111111; --sub:#4a4a4f; --muted:#8b8b92; --line:#ececee; --chip:#f2f2f4; --hover:#f4f4f6; --stage:#e6e6ea;
  --blue:#111111; --blue-soft:#f4f4f6; --blue-line:#e4e4e8; --red:#e5487f;
  --brand:#ff4f8b; --brand-soft:#fff0f5;
  --live-tint:#ffffff; --prep:#4a4a4f; --prep-bg:#f2f2f4; --live:#e5487f; --live-bg:#fff0f5; --done:#8b8b92; --done-bg:#f4f4f6;
  --promo-a:#262a66; --promo-b:#4c3a95;
  --c1:#2a2a2f; --c2:#38383e; --c3:#45454c; --c4:#52525a; --c5:#5f5f67; --c6:#6c6c74;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mark:"Montserrat","Arial Black",system-ui,sans-serif;
  --hdr:52px; --lnb:250px; --rail:72px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;margin:0}
body.previewing{background:var(--stage)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.tn{font-variant-numeric:tabular-nums}
ul,ol{list-style:none;margin:0;padding:0}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
p{margin:0}
svg.i{width:22px;height:22px;flex:none}

/* 기기 미리보기 막대 */
.devbar{display:flex;align-items:center;justify-content:center;gap:10px;height:40px;font-size:12px;color:var(--sub);background:var(--stage);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.devbar .seg{display:flex;background:var(--bg);border-radius:8px;padding:2px;gap:2px}
.devbar button{height:28px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--sub)}
.devbar button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.devbar .now{font-weight:700;color:var(--fg)}

/* 프레임: 미리보기일 때 기기 폭으로 고정, transform으로 fixed 요소를 프레임 안에 가둠 */
.frame{position:relative;background:var(--bg);height:calc(100vh - 40px);height:calc(100dvh - 40px);overflow:hidden;transform:translateZ(0)}
.scroll{height:100%;overflow-y:auto;overflow-x:hidden}
.frame.preview{margin:0 auto;box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(0,0,0,.08)}
html,body{height:100%;overflow:hidden}

/* header */
.hdr{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);height:var(--hdr);
  display:flex;align-items:center;gap:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.burger{width:40px;height:40px;display:grid;place-items:center;border-radius:8px}
.burger:hover{background:var(--hover)}
.mark{font-family:var(--f-mark);font-weight:800;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center}
.mark i{width:6px;height:6px;border-radius:50%;background:var(--brand);display:inline-block;margin-left:3px;transform:translateY(-6px)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;position:relative}
.icon-btn:hover{background:var(--hover)}
.coinchip{height:32px;display:inline-flex;align-items:center;gap:4px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--sub)}
.coinchip b{color:var(--fg)}
.dot{position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:8px;font-weight:700;font-size:14px;white-space:nowrap}
.btn-out{border:1px solid var(--line);background:var(--bg)}
.btn-blk{background:var(--fg);color:var(--bg)}
.btn-blue{background:var(--blue);color:#fff}
.btn-green{background:var(--live);color:#fff}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn-gray{background:var(--chip);font-weight:600}
.btn[disabled]{opacity:.35;cursor:not-allowed}

/* sidebar */
.lnb{position:fixed;left:0;top:var(--hdr);bottom:0;width:var(--lnb);z-index:40;background:var(--bg);border-right:1px solid var(--line);
  overflow-y:auto;padding:12px 8px calc(20px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;transition:transform .2s,width .2s}
.nv{display:flex;align-items:center;gap:14px;height:40px;padding:0 12px;border-radius:8px;font-size:15px;font-weight:500;flex:none}
.nv:hover{background:var(--hover)}
.nv[aria-current="page"]{background:var(--hover);font-weight:700}
.nv small{display:none}
.promo{margin:8px 0;border-radius:8px;padding:12px 14px;border:1px solid var(--line);background:var(--hover);display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--sub);line-height:1.45;font-weight:500;flex:none}
.promo b{font-size:14px;color:var(--fg)}
.lnb hr{border:0;border-top:1px solid var(--line);margin:10px 4px;flex:none}
.lbl-s{font-size:12px;font-weight:600;color:var(--muted);padding:2px 12px 6px}
.recent a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px}
.recent a:hover{background:var(--hover)}
.recent .sw{width:34px;height:34px;border-radius:8px;flex:none}
.recent b{display:block;font-size:13px;font-weight:600;line-height:1.35}
.recent small{font-size:11px;color:var(--muted)}
.sub{display:flex;align-items:center;gap:14px;height:38px;padding:0 12px;border-radius:8px;font-size:14px;flex:none}
.sub:hover{background:var(--hover)}
.legal{font-size:12px;color:var(--muted);padding:4px 12px}
.scrim{display:none}
#app{transition:margin .2s}

/* page */
.page{max-width:1080px;margin:0 auto;padding-block:28px 120px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.utabs{display:flex;gap:26px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.utabs button,.utabs a{padding:12px 2px;color:var(--muted);font-size:16px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.utabs [aria-selected="true"]{color:var(--fg);font-weight:700;border-color:var(--fg)}
.utabs button[disabled]{opacity:.4;cursor:not-allowed}
.utabs .live-dot{width:6px;height:6px;border-radius:50%;background:var(--live)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:600;background:var(--bg);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"] .n{color:#bbb}
.st{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.prep{color:var(--prep);background:var(--prep-bg)}
.st.live{color:var(--live);background:var(--live-bg)}
.st.done{color:var(--done);background:var(--done-bg)}
.st.done::before{content:"✓";width:auto;height:auto;background:none;font-size:11px}
.char{display:grid;place-items:center;color:#fff;font-weight:800;line-height:1;font-size:15px}
.char::before{content:attr(data-i)}
.gimg .char{font-size:44px}.cd-cover .char{font-size:72px}.ccard .face .char{font-size:36px}.av .char{font-size:12px}.tk-top .char,.mrow .char{font-size:14px}

.av{width:36px;height:36px;border-radius:50%;background:var(--fg);display:grid;place-items:center;flex:none}

/* home: 블록 그리드 */
  background:radial-gradient(circle at 85% 30%,#7a6d8a 0,transparent 45%),radial-gradient(circle at 65% 90%,#3c4a63 0,transparent 50%),#4f5266}
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 14px;padding-top:36px;flex-wrap:wrap}
.day.on.today i{color:#fff}
.home-head h2{font-size:24px;display:flex;align-items:center;gap:8px}
.home-head h2 span{font-size:14px;background:var(--chip);border-radius:999px;padding:1px 10px}
.home-head p{color:var(--sub);font-size:14px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:20px;margin-top:18px}
.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);min-width:0}
.card:hover{border-color:#d6d6dc}
.cover{aspect-ratio:16/10;position:relative;display:grid;place-items:center;color:#fff;overflow:hidden}

.cover .big{position:relative;font-size:44px;font-weight:800;letter-spacing:-.06em;line-height:1}
.cover .cap{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-style:italic;font-weight:700;font-size:13px;opacity:.9}
.cover .st{position:absolute;top:12px;left:12px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.cover .no{position:absolute;top:12px;right:14px;font-family:var(--f-mark);font-size:12px;opacity:.7}
.card-b{padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-b h3{font-size:17px;line-height:1.35;margin-bottom:2px}
.meta{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--sub)}
.meta svg{width:16px;height:16px;color:var(--muted);flex:none}
.sumrow{margin-top:8px;background:var(--hover);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.sumrow b{margin-left:auto;color:var(--fg);font-size:15px}
.prog{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--prep)}
.card-a{display:flex;gap:8px;margin-top:10px}
.card-a .btn{flex:1;height:38px}
.addcard{border:1.5px dashed #d5d5db;border-radius:12px;display:grid;place-items:center;text-align:center;color:var(--sub);min-height:260px;padding:20px}
.addcard:hover{background:var(--hover)}
.addcard b{display:block;font-size:16px;color:var(--fg);margin-top:8px}
.addcard .plus{width:44px;height:44px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;margin:0 auto;font-size:24px;line-height:1}

/* event workspace */
.ev-top{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.ev-top .back{font-size:13px;color:var(--muted)}
.ev-top h1{font-size:26px;margin-top:6px}
.ev-top .meta{margin-top:6px;flex-wrap:wrap}
.flowbox{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:20px 0 6px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.flow{display:flex;align-items:center;flex:1;min-width:260px}
.flow li{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted);flex:1}
.flow li:last-child{flex:none}
.flow li i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;flex:none;background:var(--bg)}
.flow li::after{content:"";flex:1;height:2px;background:var(--line);margin:0 10px}
.flow li:last-child::after{display:none}
.flow li.ok{color:var(--fg)}
.flow li.ok i{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.flow li.ok::after{background:var(--fg)}
.flow li.cur{color:var(--fg)}
.flow li.cur i{border-color:var(--fg);color:var(--fg)}
.flow li.cur.live-now i{border-color:var(--live);color:var(--live);box-shadow:0 0 0 4px var(--live-bg)}
.flow-act{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flow-act small{color:var(--sub);font-size:13px}
.confirm{background:var(--prep-bg);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.confirm span{flex:1;min-width:180px}
.panel{border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h3{font-size:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:20px}
.stat4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:20px}
.stat4 div{background:var(--bg);padding:14px 16px}
.stat4 small{display:block;color:var(--muted);font-size:12px}
.stat4 b{font-size:19px}
.check li{padding:10px 0;border-bottom:1px solid var(--line)}
.check li:last-child{border:0}
.check label{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--fg)}
.rows li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.rows li:last-child{border:0}
.rows span:last-child{color:var(--sub)}
.notes li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.notes li:last-child{border:0}
.notes time{color:var(--muted);font-size:12px;padding-top:2px}
.notes .k{font-size:11px;font-weight:700;color:var(--blue);margin-right:6px}
.empty{padding:28px 18px;text-align:center;color:var(--sub);border:1px dashed var(--line);border-radius:12px;margin-top:20px}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.lockbox{position:relative}
.rank li{display:grid;grid-template-columns:20px minmax(0,1fr) 84px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.rank li:last-child{border:0}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--fg)}
.rank li:first-child .bar i{background:var(--brand)}
.visit{display:flex;align-items:center;justify-content:space-between;gap:12px}
.visit b{font-size:40px;font-weight:800;line-height:1}
.memo-form{display:flex;gap:8px;margin-top:12px}
.memo-form input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--bg)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{font-size:12px;background:var(--chip);border-radius:6px;padding:4px 9px}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start;margin-top:20px}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 14px}
.pcard{text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0}
.pimg{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);position:relative;display:grid;place-items:center;margin-bottom:8px;overflow:hidden}
.pimg svg{width:42%;height:42%}
.pimg .q{position:absolute;top:8px;left:8px;background:var(--brand);color:#fff;font-size:12px;font-weight:800;border-radius:6px;padding:1px 7px}
.pimg .low{position:absolute;right:8px;bottom:8px;background:var(--bg);font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;color:var(--red)}
.pcard small{color:var(--sub);font-size:12px}
.pcard b{font-size:15px;font-weight:600;line-height:1.4}
.pcard .pr{font-size:15px;font-weight:700}
.cart{border:1px solid var(--line);border-radius:12px;padding:18px;position:sticky;top:calc(var(--hdr) + 16px);background:var(--bg)}
.cart-h{display:flex;justify-content:space-between;align-items:center}
.cart-h h3{font-size:16px;margin:0}
.cart-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line)}
.lbl{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.cart .chip{height:34px;padding:0 11px;font-size:13px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 12px}
.total b{font-size:24px;font-weight:800}
.log li{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--sub)}
.sheet-x,.sheet-scrim{display:none}


/* 홈: 지금 운영 중 카드 */
.nowcard.next{border-color:var(--line);background:var(--bg)}
.nowcard{display:grid;grid-template-columns:220px minmax(0,1fr) auto;gap:22px;align-items:center;border:1.5px solid var(--live);border-radius:14px;padding:14px 22px 14px 14px;background:var(--live-tint)}
.nc-cover{aspect-ratio:16/10;border-radius:10px;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.nc-cover .big{font-size:36px;font-weight:800;letter-spacing:-.06em}
.nc-b{min-width:0;display:flex;flex-direction:column;gap:4px}
.nc-b h2{font-size:22px}
.nc-stats{display:flex;gap:26px;margin-top:6px}
.nc-stats small{display:block;font-size:12px;color:var(--sub)}
.nc-stats b{font-size:18px}
.nc-go{height:52px;padding:0 22px;font-size:15px}

/* 운영 중 판매 전용 화면 */
.page.focus{padding-block:0}
.ftop{position:sticky;top:var(--hdr);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ftop .back{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;font-size:18px;flex:none}
.ftop .back:hover{background:var(--hover)}
.ft-t{flex:1;min-width:0}
.ft-name{display:flex;gap:8px;align-items:center;min-width:0}
.ft-name b{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft-t small{display:block;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft-t small b{color:var(--fg)}
.ft-a{display:flex;gap:6px;flex:none}
.focus .pos{margin-top:16px}
.focus .confirm{margin-top:12px}
.dock{position:sticky;bottom:0;z-index:30;margin-top:20px;display:flex;flex-direction:column;gap:8px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(255,255,255,0),var(--bg) 22px)}
.fieldbar{display:flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);border-radius:12px;padding:8px}
.fb-visit,.fb-memo{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:8px;background:rgba(255,255,255,.12);font-weight:700;flex:none}
.fb-visit b{font-size:18px}
.fb-visit i{font-style:normal;background:var(--live);color:#fff;border-radius:6px;padding:1px 8px;font-size:14px}
.fb-memo[aria-expanded="true"]{background:var(--bg);color:var(--fg)}
.fb-memo span{font-size:12px;opacity:.7}
.fb-last{flex:1;min-width:0;font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.memo-row{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.memo-row input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--bg)}
.memo-row .quick{width:100%;margin:0}
.minibar{display:none;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--fg);border-radius:12px;padding:6px 6px 6px 14px}
.mb-l{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;line-height:1.3}
.mb-l b{font-size:16px}
.mb-l small{font-size:12px;color:var(--sub);text-decoration:underline;text-underline-offset:2px}
.minibar .btn{height:46px;padding:0 20px;font-size:15px}


/* ===== 캐릭터톡 메신저 (다크 전용 화면) ===== */
.frame.talk .scroll{overflow:hidden}
.frame.talk #app{height:calc(100% - var(--hdr))}
.frame.talk[data-device="mobile"] .hdr{display:none}
.frame.talk[data-device="mobile"] #app{height:100%}
.frame.talk[data-device] .tabbar{display:none}
.tk{--t-bg:#0e0e11;--t-panel:#16161b;--t-line:#2a2a31;--t-fg:#ececf1;--t-sub:#9b9ba7;--t-them:#24242c;--t-me:#ff4f8b;--t-hi:#22222a;
  color-scheme:dark;background:var(--t-bg);color:var(--t-fg);height:100%;display:grid;grid-template-columns:300px minmax(0,1fr)}
.tk-list{background:var(--t-panel);border-right:1px solid var(--t-line);overflow-y:auto;min-width:0}
.tk-list h2{font-size:18px;padding:18px 18px 4px}
.tk-list p{font-size:12px;color:var(--t-sub);padding:0 18px 10px}
.tk-item{display:flex;gap:12px;align-items:center;padding:12px 18px}
.tk-item:hover{background:var(--t-hi)}
.tk-item[aria-current="page"]{background:var(--t-hi)}
.tk-av{width:46px;height:46px;border-radius:17px;display:grid;place-items:center;flex:none;position:relative}
.tk-av .char{width:66%;height:66%}
.tk-item .tx{flex:1;min-width:0}
.tk-item b{display:block;font-size:15px}
.tk-item small{display:block;font-size:13px;color:var(--t-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-item .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11px;color:var(--t-sub);flex:none}
.tk-item .un{background:var(--t-me);color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.tk-conv{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.tk-top{height:62px;flex:none;display:flex;align-items:center;gap:12px;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--t-line);background:var(--t-bg)}
.tk-back{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;color:var(--t-fg)}
.tk-back:hover{background:var(--t-hi)}
.tk-top .tk-av{width:38px;height:38px;border-radius:14px}
.tk-top .tx{flex:1;min-width:0;line-height:1.3}
.tk-top b{font-size:16px}
.tk-top small{display:block;font-size:12px;color:var(--t-sub)}
.tk-coin{font-size:12px;font-weight:700;border:1px solid var(--t-line);border-radius:999px;padding:5px 10px;white-space:nowrap}
.tk-coin em{font-style:normal;color:#ffd84d}
.tk-msgs{flex:1;min-height:0;overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.tk-day{align-self:center;font-size:11px;color:var(--t-sub);background:var(--t-panel);border-radius:999px;padding:3px 12px;margin:4px 0 10px}
.mrow{display:flex;gap:8px;align-items:flex-end}
.mrow.me{justify-content:flex-end}
.mrow .tk-av{width:34px;height:34px;border-radius:13px;align-self:flex-start}
.mrow .spacer{width:34px;flex:none}
.mcol{display:flex;flex-direction:column;gap:3px;max-width:74%;min-width:0}
.mrow.me .mcol{align-items:flex-end}
.mcol .nm{font-size:12px;color:var(--t-sub)}
.bub{padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
.mrow.them .bub{background:var(--t-them);border-top-left-radius:6px}
.mrow.me .bub{background:var(--t-me);color:#fff;border-top-right-radius:6px}
.mt{font-size:10px;color:var(--t-sub);white-space:nowrap;flex:none}
.ledger{border:1px solid var(--t-line);background:var(--t-panel);border-radius:16px;padding:12px 14px;min-width:220px}
.ledger small{display:block;font-size:11px;color:var(--t-sub);letter-spacing:.04em}
.ledger b{display:block;font-size:15px;margin:2px 0 8px}
.ledger .lg{display:grid;grid-template-columns:repeat(3,auto);gap:4px 14px;font-size:12px;color:var(--t-sub)}
.ledger .lg span b{display:inline;font-size:13px;color:var(--t-fg);margin:0}
.typing .bub{display:flex;gap:4px;padding:13px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--t-sub);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.tk-lock{align-self:center;text-align:center;background:var(--t-panel);border:1px solid var(--t-line);border-radius:16px;padding:16px 18px;margin:10px 0;max-width:320px}
.tk-lock b{display:block;font-size:14px}
.tk-lock p{font-size:12px;color:var(--t-sub);margin:4px 0 12px}
.tk-lock .btn{background:var(--t-me);color:#fff;height:36px}
.tk-end{align-self:center;font-size:12px;color:var(--t-sub);margin:10px 0}
.tk-bottom{flex:none;border-top:1px solid var(--t-line);background:var(--t-bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.tk-quick{display:flex;gap:6px;overflow-x:auto;padding:10px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));scrollbar-width:none}
.tk-quick button{border:1px solid var(--t-line);color:var(--t-fg);border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap;flex:none}
.tk-quick button:hover{background:var(--t-hi)}
.tk-comp{display:flex;gap:8px;align-items:center;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
.tk-comp input{flex:1;min-width:0;height:44px;border-radius:22px;background:var(--t-them);border:0;color:var(--t-fg);padding:0 18px;font-size:15px}
.tk-comp input::placeholder{color:var(--t-sub)}
.tk-round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:20px;font-weight:700}
.tk-attach{background:var(--t-them);color:var(--t-fg)}
.tk-send{background:var(--t-me);color:#fff}
.tk-send[disabled]{opacity:.4}
.frame[data-device="tablet"] .tk{grid-template-columns:240px minmax(0,1fr)}
.frame[data-device="tablet"] .tk-item{padding:10px 14px}
.frame[data-device="mobile"] .tk{grid-template-columns:minmax(0,1fr)}
.frame[data-device="mobile"] .tk-list{display:none}
.frame:not([data-device="mobile"]) .tk-back{display:none}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.6}}


/* ===== 캐릭터톡 갤러리 (포스타입 캐릭터톡 구조) ===== */
.feat{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 24px)/3);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:18px}
.feat a{scroll-snap-align:start}
.frame[data-device="mobile"] .feat{grid-auto-columns:86%}
.frame[data-device="mobile"] .feat .ccard{aspect-ratio:4/3}
.row-h{display:flex;justify-content:space-between;align-items:center;margin:34px 0 12px}
.row-h h2{font-size:20px}
.row-h a{font-size:13px;color:var(--sub)}
.hrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,calc((100% - 60px)/6));gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.frame[data-device="tablet"] .hrow{grid-auto-columns:calc((100% - 36px)/4)}
.frame[data-device="mobile"] .hrow{grid-auto-columns:42%}
.gcard{scroll-snap-align:start;display:flex;flex-direction:column;gap:2px;min-width:0}
.gimg{aspect-ratio:3/4;border-radius:10px;position:relative;overflow:hidden;display:grid;place-items:center;margin-bottom:6px}

.gimg .char{width:48%;height:auto;aspect-ratio:1}
.gimg .badge{position:absolute;top:8px;left:8px;margin:0;color:#fff;z-index:1}
.gcard b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .d{font-size:13px;color:var(--sub);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.gstat{display:flex;gap:10px;font-size:12px;color:var(--muted);margin-top:2px}
.gstat span{display:inline-flex;align-items:center;gap:3px}
.gstat svg{width:13px;height:13px}
.gby{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:4px}
.gby i{width:12px;height:12px;border-radius:50%;background:var(--blue);display:inline-block}

/* 설명 페이지 */
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;color:var(--sub);background:var(--chip);border-radius:6px;padding:2px 8px}
.cd{display:grid;grid-template-columns:320px minmax(0,1fr);gap:36px;margin-top:18px;align-items:start}
.cd-cover{aspect-ratio:3/4;border-radius:16px;position:relative;overflow:hidden;display:grid;place-items:center}

.cd-cover .char{width:50%;height:auto;aspect-ratio:1}
.cd-cover .badge{position:absolute;top:14px;left:14px;margin:0;color:#fff;z-index:1;font-size:12px;padding:2px 8px}
.cd-info{display:flex;flex-direction:column;gap:12px;min-width:0}
.cd-kind{font-size:13px;font-weight:700;color:var(--brand)}
.cd-info h1{font-size:30px;line-height:1.3}
.cd-by{display:flex;align-items:center;gap:10px;font-size:14px;flex-wrap:wrap}
.cd-by .av{width:28px;height:28px}
.cd-by .gstat{font-size:13px;margin:0}
.cd-desc{font-size:16px;line-height:1.8;color:var(--sub)}
.prologue{background:var(--hover);border-radius:12px;padding:16px 18px}
.prologue small{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.prologue p{font-size:15px;line-height:1.75}
.cd-act{display:flex;gap:8px;align-items:center;margin-top:4px}
.cd-act .btn{height:52px;font-size:16px}
.cd-act .go{flex:1;max-width:320px;background:var(--brand);color:#fff}
.cd-note{font-size:12px;color:var(--muted)}
.cd-prev{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:14px;padding:18px;max-width:640px}
.frame[data-device="tablet"] .cd{grid-template-columns:240px minmax(0,1fr);gap:24px}
.frame[data-device="mobile"] .cd{grid-template-columns:minmax(0,1fr);gap:18px;margin-top:10px}
.frame[data-device="mobile"] .cd-cover{aspect-ratio:4/3}
.frame[data-device="mobile"] .cd-cover .char{width:34%}
.frame[data-device="mobile"] .cd-info h1{font-size:24px}
.frame[data-device="mobile"] .cd-act{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0;z-index:5}
.frame[data-device="mobile"] .cd-act .go{max-width:none}
/* 메신저: 목록만 보기 */
.tk-list .tk-back{display:none}
.tk-list-h{display:flex;align-items:center;gap:6px;padding:14px 12px 0}
.tk-list-h h2{padding:0 6px}
.tk-empty{display:grid;place-items:center;text-align:center;color:var(--t-sub);font-size:14px;padding:30px}
.tk-empty b{display:block;color:var(--t-fg);font-size:16px;margin-bottom:4px}
.tk-empty a{display:inline-block;margin-top:12px;color:#fff;background:var(--t-me);border-radius:8px;padding:8px 14px;font-weight:700}
.frame[data-device="mobile"] .tk.noconv .tk-list{display:block}
.frame[data-device="mobile"] .tk.noconv .tk-conv{display:none}
.frame[data-device="mobile"] .tk-list .tk-back{display:grid}


/* ===== 재고 관리·필터·모달·새 행사 마법사 ===== */
.inv-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.inv-head h1{font-size:24px}
.inv-head p{font-size:14px;color:var(--sub);margin-top:2px}
.inv-btns{display:flex;gap:8px}
.srow{display:flex;gap:8px;margin:20px 0 10px}
.sbox{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 12px;height:40px;color:var(--muted)}
.sbox svg{width:18px;height:18px;flex:none}
.sbox input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:14px;color:var(--fg)}
.fbtn{flex:none}
.fbtn .fb-n{background:var(--brand);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.fpanel{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px;background:var(--bg)}
.frow{display:grid;grid-template-columns:60px minmax(0,1fr);gap:10px;align-items:center}
.frow>span{font-size:13px;font-weight:700;color:var(--sub)}
.frow .chip{height:32px;font-size:13px;padding:0 12px}
.freset{align-self:flex-end;font-size:13px;color:var(--sub);text-decoration:underline;text-underline-offset:2px}
.cnt{font-size:13px;color:var(--muted);margin:4px 0 6px}
.pn{display:flex;align-items:center;gap:10px}
.th40{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;flex:none}
.th40 svg{width:22px;height:22px}
.low-s{color:var(--red);font-weight:700}
.ilist{display:none}
.ilist button{display:flex;gap:12px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.ilist .tx{flex:1;min-width:0}
.ilist b{display:block;font-size:15px}
.ilist small{display:block;font-size:12px;color:var(--sub)}
.ilist .r{text-align:right;font-size:13px;flex:none}
.frame[data-device="mobile"] .itable-wrap{display:none}
.frame[data-device="mobile"] .ilist{display:block}
.frame[data-device="mobile"] .inv-btns{width:100%}
.frame[data-device="mobile"] .inv-btns .btn{flex:1}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80}
.modal{position:fixed;z-index:81;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--bg);border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal.wide{width:min(760px,calc(100% - 32px))}
.frame[data-device="mobile"] .modal{left:0;right:0;bottom:0;top:auto;transform:none;width:100%;border-radius:16px 16px 0 0;max-height:92%;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.modal header h2{font-size:20px}
.modal .x{width:36px;height:36px;border-radius:8px;font-size:22px;flex:none}
.modal .x:hover{background:var(--hover)}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.fld>span{font-size:13px;font-weight:700;color:var(--sub)}
.fld input,.fld select,.fld textarea{height:42px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:15px;background:var(--bg);width:100%}
.fld textarea{height:auto;padding:10px 12px;resize:vertical}
.fld output{height:42px;display:flex;align-items:center;font-weight:700}
.fld small{font-size:12px;color:var(--muted)}
.fld.err input{border-color:var(--red)}
.fld .em{color:var(--red);font-size:12px}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf-photo{width:84px;height:84px;border:1.5px dashed #d5d5db;border-radius:12px;display:grid;place-items:center;font-size:12px;color:var(--sub);margin-bottom:14px}
.stockreg{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.stockreg h3{font-size:16px}
.sr-row{display:flex;gap:8px;margin:10px 0}
.sr-row input{width:96px;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px}
.sr-row select{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--bg)}
.slog li{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.slog .add{color:var(--live);font-weight:700}
.slog .del{color:var(--red);font-weight:700}
/* 새 행사 마법사 */
.wsteps{display:flex;align-items:center;margin-bottom:18px}
.wsteps li{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);flex:1}
.wsteps li:last-child{flex:none}
.wsteps li i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;flex:none}
.wsteps li::after{content:"";flex:1;height:2px;background:var(--line);margin:0 8px}
.wsteps li:last-child::after{display:none}
.wsteps li.ok,.wsteps li.cur{color:var(--fg)}
.wsteps li.ok i{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.wsteps li.cur i{border-color:var(--fg)}
.wsteps li.ok::after{background:var(--fg)}
.wsec{margin-bottom:18px}
.wsec h3{font-size:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.wsec h3 small{font-size:12px;color:var(--muted);font-weight:500}
.wseg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.wseg button{flex:1;height:36px;border-radius:8px;font-size:13px;font-weight:600;color:var(--sub)}
.wseg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.wnote{font-size:12px;color:var(--sub);background:var(--hover);border-radius:8px;padding:8px 10px;margin-top:8px}
.wchk li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.wchk input[type=checkbox]{width:18px;height:18px;accent-color:var(--fg);flex:none}
.wadd{display:flex;gap:8px;margin-top:8px}
.wadd input{flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px}
.witems li{display:grid;grid-template-columns:20px 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.witems li.off{opacity:.45}
.witems b{font-size:14px;display:block}
.witems small{font-size:12px;color:var(--sub);display:block}
.witems .why{color:var(--blue)}
.witems input[type=checkbox]{width:18px;height:18px;accent-color:var(--fg)}
.wfoot{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:14px;margin-top:6px;position:sticky;bottom:-22px;background:var(--bg);padding-bottom:4px}
.frame[data-device="mobile"] .wfoot{bottom:calc(-20px - env(safe-area-inset-bottom,0px))}
.wfoot .btn{min-width:110px}
.hsug{display:flex;flex-direction:column;gap:6px}
.hsug button{text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.hsug button[aria-pressed="true"]{border-color:var(--fg);background:var(--hover);font-weight:600}
.frame[data-device="mobile"] .fld2{grid-template-columns:1fr}
.frame[data-device="mobile"] .wsteps li{font-size:11px}


/* ===== 홈: 폴더형 행사 카드 ===== */
.grid.folders{row-gap:34px}
.fold{position:relative;padding-top:40px;min-width:0;display:flex;flex-direction:column;text-align:left;font:inherit;color:#222226}
.fold>.fold-body{flex:1}
.fold-tab{position:absolute;left:0;top:12px;width:104px;height:36px;background:var(--fb);border-radius:14px 14px 0 0;z-index:1;padding:8px 0 0 12px}
.tab-pill{display:inline-flex;align-items:center;gap:6px;background:#26262b;color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:3px 10px}
.tab-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dot)}
.paper{position:absolute;z-index:0;pointer-events:none}
.paper.p1{left:92px;right:34%;top:14px;height:34px;background:var(--p1);clip-path:polygon(0 72%,100% 8%,100% 100%,0 100%)}
.paper.p2{left:36%;right:20%;top:0;height:48px;background:var(--p2);clip-path:polygon(0 100%,92% 0,100% 100%)}
.fold-body{position:relative;z-index:1;background:var(--fb);border-radius:0 18px 18px 18px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:4px;min-height:206px}
.fold-body h3{font-size:19px;line-height:1.35;padding-right:118px;margin-bottom:8px;color:#1d1d21}
.fl{font-size:14px;font-weight:600;color:#3a3a40;padding-right:110px}
.fold-foot{display:flex;gap:8px;margin-top:auto;padding-top:18px}
.ready{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:1.5px solid rgba(0,0,0,.16);border-radius:12px;height:44px;padding:0 14px;font-size:14px;font-weight:700;background:rgba(255,255,255,.6);white-space:nowrap}
.ready i{flex:1;min-width:30px;height:5px;border-radius:3px;background:rgba(0,0,0,.12);overflow:hidden;display:block}
.ready i b{display:block;height:100%;background:#26262b;border-radius:3px}
.ready em{font-style:normal;font-size:12px;color:#55555c}
.ready strong{margin-left:auto;font-size:15px}
.open{height:44px;padding:0 16px;border:1.5px solid rgba(0,0,0,.16);border-radius:12px;background:#fff;display:inline-flex;align-items:center;font-weight:700;font-size:14px;white-space:nowrap;color:#1d1d21}
.open:hover{background:#26262b;color:#fff;border-color:#26262b}
.polaroid{position:absolute;z-index:2;top:6px;right:24px;width:100px;background:#fff;padding:7px 7px 22px;border-radius:3px;box-shadow:0 8px 18px rgba(0,0,0,.14);transform:rotate(7deg);transition:transform .2s}
.polaroid .ph{display:grid;place-items:center;aspect-ratio:1;background:var(--ph);color:#fff;font-weight:800;font-size:24px;letter-spacing:-.05em}
.polaroid svg{position:absolute;top:-14px;left:44%;width:16px;height:38px}
.fold:hover .polaroid{transform:rotate(3deg) translateY(-4px)}
.fold.add{cursor:pointer;background:none;border:0;padding-left:0;padding-right:0}
.fold.add .fold-tab{background:none;border:1.5px dashed #c9c9d1;border-bottom:0}
.fold.add .fold-body{background:none;border:1.5px dashed #c9c9d1;align-items:center;justify-content:center;text-align:center;color:var(--sub)}
.fold.add .fold-body b{font-size:16px;color:var(--fg);display:block;margin-top:8px}
.fold.add .plus{width:44px;height:44px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:24px;margin:0 auto}
.fold.add:hover .fold-body{background:var(--hover)}
.frame[data-device="mobile"] .grid.folders{row-gap:26px}
.frame[data-device="mobile"] .polaroid{width:84px;right:16px}
.frame[data-device="mobile"] .fold-body{min-height:0;padding:20px 16px 16px}
.frame[data-device="mobile"] .fold-body h3{font-size:17px;padding-right:96px}
.frame[data-device="mobile"] .fl{padding-right:92px;font-size:13px}
.frame[data-device="mobile"] .fold.add .fold-body{min-height:120px}


/* ===== 재고: 상품 목록 (레퍼런스 POS 관리 화면형) ===== */
.btn-primary{background:var(--blue);color:#fff}
.btn-primary[disabled]{background:#cfe0fd;color:#fff;opacity:1}
.btn-soft{background:var(--blue-soft);color:var(--blue)}
.btn-soft[aria-pressed="true"]{background:var(--blue);color:#fff}
.btn-ghostb{border:1px solid var(--line);background:var(--bg)}
.ih{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ih h1{font-size:22px}
.isearch{flex:0 1 240px;height:42px;border-radius:10px}
.ih-r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.ih-r .btn{height:42px;border-radius:10px}
.ctabs{display:flex;gap:8px;margin:20px 0 14px;overflow-x:auto;scrollbar-width:none}
.ctabs button{height:38px;padding:0 18px;border-radius:10px;background:var(--chip);font-size:14px;font-weight:700;color:var(--sub);white-space:nowrap;flex:none}
.ctabs button[aria-pressed="true"]{background:#4b5563;color:#fff}
.itools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.itools select{border:0;background:none;font:inherit;font-size:14px;font-weight:600;padding:6px 4px;cursor:pointer;color:var(--fg)}
.tbtn{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:var(--bg);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tbtn[aria-expanded="true"]{border-color:var(--fg)}
.tbtn.danger{color:var(--red);border-color:#ffd2cf}
.selbar{display:flex;align-items:center;gap:6px;font-size:13px}
.confirmdel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff1f0;border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:14px}
.confirmdel span{flex:1;min-width:160px}
.ithead,.irow{display:grid;grid-template-columns:var(--cols);align-items:center;column-gap:8px}
.ithead{background:#f3f4f6;border-top:1px solid #d6d9de;border-bottom:1px solid #e5e7eb;padding:10px 12px;font-size:12px;font-weight:600;color:var(--sub)}
.ithead span:not(:first-of-type),.irow>.iqty,.irow>.itg{justify-self:center;text-align:center}
.irow{padding:6px 12px;border-bottom:1px solid #f1f2f4}
.irow input[type=checkbox],.ithead input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue)}
.icell{display:flex;align-items:center;gap:20px;text-align:left;min-width:0;padding:4px 0;border-radius:8px}
.icell:hover .nm{text-decoration:underline;text-underline-offset:3px}
.pthumb{width:72px;height:72px;border-radius:8px;display:grid;place-items:center;flex:none;overflow:hidden;background:#f1f2f4;color:var(--sub)}
.pthumb svg{width:34px;height:34px;color:var(--fg)}
.pthumb b{color:#fff;font-size:13px;line-height:1.2;text-align:center;padding:4px}
.pthumb .plus{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600}
.pthumb .plus::before{content:"+";font-size:26px;font-weight:400;line-height:1}
.in{display:flex;flex-direction:column;gap:1px;min-width:0}
.in .nm{font-size:15px;display:flex;align-items:center;gap:6px}
.in .pr{font-size:16px}
.in small{font-size:12px;color:var(--muted)}
.ptag{font-style:normal;font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:4px;padding:0 5px}
.irow.so .icell{opacity:.55}
.iqty{font-size:15px}
.tg{width:50px;height:30px;border-radius:999px;background:#e3e5e8;position:relative;flex:none;transition:background .15s}
.tg i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.tg[aria-checked="true"]{background:var(--blue)}
.tg[aria-checked="true"] i{left:23px}
.itg .tl{display:none}
.mv{display:flex;gap:4px;justify-self:end}
.mv button{width:30px;height:30px;border:1px solid var(--line);border-radius:6px}
.iempty{padding:40px;text-align:center;color:var(--muted)}
.pager{display:flex;justify-content:center;gap:6px;margin-top:22px}
.pager button{min-width:36px;height:36px;border-radius:50%;font-size:15px;color:var(--sub)}
.pager button[aria-current="page"]{background:var(--chip);color:var(--fg);font-weight:700}
.pager button[disabled]{opacity:.3}
.frame[data-device="mobile"] .ithead{display:none}
.frame[data-device="mobile"] .irow{padding:8px 0;column-gap:6px}
.frame[data-device="mobile"] .irow>.iqty{display:none}
.frame[data-device="mobile"] .pthumb{width:56px;height:56px}
.frame[data-device="mobile"] .icell{gap:12px}
.frame[data-device="mobile"] .itg{display:flex;flex-direction:column;align-items:center;gap:2px}
.frame[data-device="mobile"] .itg .tl{display:block;font-size:10px;color:var(--muted)}
.frame[data-device="mobile"] .tg{width:42px;height:26px}
.frame[data-device="mobile"] .tg i{width:20px;height:20px}
.frame[data-device="mobile"] .tg[aria-checked="true"] i{left:19px}
.frame[data-device="mobile"] .isearch{flex:1 1 100%;order:3}
.frame[data-device="mobile"] .ih-r{margin-left:0;width:100%}
.frame[data-device="mobile"] .ih-r .btn{flex:1;padding:0 8px;font-size:13px}
/* 상품 추가 모달 */
.modal.pm{padding:0;display:flex;flex-direction:column;width:min(720px,calc(100% - 32px))}
.pm-scroll{overflow-y:auto;padding:28px 28px 8px;min-height:0}
.pm-scroll h2{font-size:20px;margin-bottom:22px}
.pm-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 28px;border-top:1px solid var(--line);flex:none}
.pm-foot .btn{height:52px;border-radius:12px;min-width:96px;font-size:15px}
.pm-foot .btn-primary{min-width:160px}
.pm-look{display:flex;gap:24px;align-items:flex-start;padding-bottom:20px}
.pm-prev{width:88px;height:84px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;font-weight:700;color:var(--muted);flex:none;overflow:hidden;word-break:keep-all}
.swatches{display:flex;flex-wrap:wrap;gap:14px}
.sw{width:36px;height:36px;border-radius:50%;color:#fff;font-weight:700;display:grid;place-items:center}
.sw.none{border:1px solid var(--line);color:var(--fg)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.pm-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 0;border-top:1px solid var(--line);font-weight:700;font-size:15px}
.qm{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#c7cbd1;color:#fff;font-size:11px;font-style:normal;margin-left:4px;cursor:help}
.req{color:var(--red);font-size:9px;vertical-align:top;margin-left:2px}
.pm .fld>span{font-size:14px;color:var(--fg)}
.pm .fld input{height:48px;font-size:15px}
.pm .fld input:focus{border-color:var(--blue);outline:0;box-shadow:0 0 0 1px var(--blue)}
.pchips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pchips button{height:34px;padding:0 14px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:600}
.pchips button[aria-pressed="true"]{background:var(--blue);color:#fff}
.pchips .dash{background:none;border:1px dashed #c4c8ce;color:var(--sub)}
.pchips input{height:34px;border:1px solid var(--blue);border-radius:999px;padding:0 12px;width:140px}
.won{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;height:48px;padding:0 14px;margin-top:8px;gap:8px}
.won input{border:0;outline:0;flex:1;min-width:0;font-size:15px;background:none;height:auto!important}
.won span{color:var(--sub);white-space:nowrap}
.hint{font-size:13px;color:var(--sub);margin-top:8px}
.radios{display:flex;gap:16px;font-weight:500}
.rd{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.rd i{width:22px;height:22px;border-radius:50%;border:1.5px solid #c4c8ce;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff}
.rd[aria-pressed="true"] i{background:var(--blue);border-color:var(--blue)}
.rd[aria-pressed="true"] i::before{content:"✓"}
.frame[data-device="mobile"] .pm-scroll{padding:22px 16px 8px}
.frame[data-device="mobile"] .pm-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.frame[data-device="mobile"] .pm-foot .btn{flex:1}
.frame[data-device="mobile"] .pm-look{flex-direction:column;gap:14px}


.won input{border:0!important;box-shadow:none!important;padding:0!important}
/* ===== 판매: POS 레이아웃 (왼쪽 색 타일 / 오른쪽 주문 패널) ===== */
.pos2{display:grid;grid-template-columns:minmax(0,1fr) 340px;margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:640px}
.pl{background:#e6e9ed;display:flex;flex-direction:column;min-width:0;padding:0 16px 12px}
.ptabs{display:flex;align-items:center;border-bottom:1px solid #c9ced6;overflow-x:auto;scrollbar-width:none}
.ptabs>button{height:54px;padding:0 22px;font-size:15px;font-weight:700;color:#5b6370;border-bottom:2px solid transparent;white-space:nowrap;flex:none}
.ptabs>button[aria-pressed="true"]{color:#111;border-color:#111}
.ptabs .sp{flex:1}
.ptabs .ib{width:44px;height:44px;display:grid;place-items:center;color:#9aa1ab;font-size:20px;flex:none}
.ptabs .ib:not([disabled]){color:#3b4250}
.psearch{padding-top:12px}
.psearch .srow{margin:0 0 8px}
.psearch .sbox{background:#fff}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding-top:12px;align-content:start;flex:1}
.pt{height:118px;border-radius:6px;color:#fff;text-align:left;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;position:relative;box-shadow:inset 0 -2px 0 rgba(0,0,0,.1)}
.pt b{font-size:14px;line-height:1.35;font-weight:700}
.pt .pp{font-size:13px;font-weight:500}
.pt .st2{font-size:11px;opacity:.85}
.pt .cnt2{position:absolute;top:8px;right:8px;min-width:24px;height:24px;border-radius:999px;background:#fff;color:#111;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 6px}
.pt[disabled]{opacity:.45;cursor:not-allowed}
.pt.add2{background:none;border:1.5px dashed #b5bcc6;color:#5b6370;align-items:center;justify-content:center;box-shadow:none;font-weight:700;font-size:14px}
.pfoot{position:sticky;bottom:0;background:#e6e9ed;padding-top:6px;z-index:2}
.pbar{display:flex;align-items:center;gap:16px;font-size:13px;color:#454b55;padding:8px 0}
.pbar button{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.pbar .pg{margin-left:auto;display:flex;align-items:center;gap:14px;font-weight:700}
.pbar .pg button{color:#9aa1ab;font-size:18px}
.popt h4{font-size:13px;margin:6px 0 8px}
.popt-row{display:flex;gap:6px;flex-wrap:wrap}
.ob{min-width:150px;flex:0 1 180px;height:50px;border-radius:8px;background:#fff;font-weight:600;font-size:13px;line-height:1.3}
.ob[aria-pressed="true"]{background:var(--blue);color:#fff}
.ob[disabled]{opacity:.5;cursor:not-allowed}
.pbtns{display:flex;gap:6px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.gb{height:50px;min-width:104px;padding:0 16px;border-radius:8px;background:#5d6673;color:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.gb.visit b{font-size:16px}
.gb.visit i{font-style:normal;background:var(--live);border-radius:6px;padding:1px 7px;font-size:13px}
.gb[aria-expanded="true"]{background:#2f3540}
.pfoot .memo-row{margin-top:8px}
.pr2{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.pos2 .cart{border:0;border-radius:0;padding:0;position:static}
.pr-top{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #eef0f3}
.seg3{display:flex;background:#eef0f3;border-radius:10px;padding:3px}
.seg3 button{height:34px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;color:#6b7280}
.seg3 button[aria-pressed="true"]{background:#fff;color:#111;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pr-ic{margin-left:auto;display:flex;gap:2px}
.pr-ic button{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:#4b5563}
.pr-ic button:hover{background:var(--hover)}
.pr-ic .sheet-x{display:none}
.frame[data-device="mobile"] .pr-ic .sheet-x{display:inline-flex;width:auto;padding:0 10px}
.pr-ic svg{width:20px;height:20px}
.qtyrow{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--blue-soft)}
.qbox{display:flex;align-items:center;background:#fff;border-radius:10px;height:42px}
.qbox button{width:42px;height:42px;font-size:20px;color:#374151}
.qbox span{min-width:40px;text-align:center;font-weight:700;font-size:16px}
.ldel{margin-left:auto;background:#fff;border-radius:10px;height:42px;padding:0 16px;font-size:13px}
.lines{flex:1;overflow-y:auto;min-height:120px}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:12px 14px;border-bottom:1px solid #eef0f3;text-align:left;width:100%}
.ln[aria-current="true"]{background:var(--blue-soft)}
.ln b{font-size:14px;font-weight:700}
.ln small{grid-column:1/-1;font-size:12px;color:var(--muted)}
.lempty{padding:30px 14px;color:var(--muted);font-size:14px;text-align:center}
.pr-bot{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;border-top:1px solid #eef0f3}
.later{align-self:flex-end;font-size:14px;color:var(--sub)}
.sumline{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.two-b{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two-b button{height:50px;border-radius:10px;font-weight:600;font-size:15px}
.two-b .discb{background:var(--blue-soft);color:var(--blue)}
.two-b .discb[aria-expanded="true"]{background:var(--blue);color:#fff}
.two-b .split{background:#eef0f3;color:#374151}
.discrow{display:flex;gap:6px;flex-wrap:wrap}
.discrow .chip{height:34px;font-size:13px}
.paybtn{height:58px;border-radius:10px;background:var(--blue);color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.paybtn i{background:#fff;color:var(--blue);border-radius:50%;min-width:24px;height:24px;font-style:normal;font-size:13px;display:grid;place-items:center}
.paybtn[disabled]{background:#cfe0fd}
.paym{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.paym button{height:64px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;font-size:16px}
.paym button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.paytot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.paytot b{font-size:26px;font-weight:800}
.change{font-size:15px;margin-top:8px}
.frame[data-device="tablet"] .pos2{grid-template-columns:minmax(0,1fr) 300px}
.frame[data-device="tablet"] .ptiles{grid-template-columns:repeat(3,minmax(0,1fr))}
.frame[data-device="tablet"] .ob{min-width:0;flex:1 1 140px}
.frame[data-device="mobile"] .pos2{grid-template-columns:minmax(0,1fr);border:0;border-radius:0;margin:12px -16px 0;min-height:0}
.frame[data-device="mobile"] .pl{padding:0 12px 10px}
.frame[data-device="mobile"] .ptabs>button{padding:0 14px;height:48px;font-size:14px}
.frame[data-device="mobile"] .ptiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.frame[data-device="mobile"] .pt{height:96px}
.frame[data-device="mobile"] .ob{min-width:0;flex:1 1 30%;height:44px}
.frame[data-device="mobile"] .pbtns .gb{flex:1;min-width:0}
.frame[data-device="mobile"] .pfoot .minibar{display:flex;margin-bottom:8px}
.pfoot .minibar{display:none}


/* ===== 리틀부스 스타일로 정리 (레퍼런스는 배치만 참고) ===== */
.fsel{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 4px 0 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;color:var(--sub);background:var(--bg)}
.fsel select{border:0;background:none;font:inherit;font-weight:700;color:var(--fg);padding:0 6px 0 2px;cursor:pointer;max-width:120px}
.fsel.on{border-color:var(--fg);color:var(--fg)}
.ctab2{margin:18px 0 12px}
.btn-out[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ithead{background:var(--hover)!important;border:0!important;border-radius:10px;font-size:12px}
.irow{border-bottom:1px solid var(--line)!important}
.pthumb{border-radius:12px!important}

.btn-blue{background:var(--fg)!important;color:var(--bg)!important}

.sum .up{color:var(--brand)}

.fold{padding-top:44px!important}

/* ===== 폴더 리디자인: 뒷판 + 사다리꼴 탭 + 종이 + 앞판 ===== */
.fold{padding-top:58px!important;isolation:isolate}
.fold::before{content:"";position:absolute;left:0;right:0;top:22px;bottom:0;background:#e6e6ea;border-radius:16px;z-index:-2}
.fold-tab{top:2px!important;left:0!important;height:40px!important;min-width:132px!important;padding:9px 30px 0 12px!important;background:#e6e6ea!important;border-radius:0!important;clip-path:polygon(0 100%,0 22%,4% 4%,12% 0,72% 0,80% 6%,100% 100%);z-index:-1!important}
.fold-tab .tab-pill{background:#26262b}
.paper{border-radius:6px!important;clip-path:none!important;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.paper.p1{left:18px!important;right:34%!important;top:34px!important;height:60px!important;background:#ffffff!important;transform:rotate(-2.5deg);z-index:-1}
.paper.p2{left:42px!important;right:40%!important;top:40px!important;height:60px!important;background:var(--brand)!important;transform:rotate(1.5deg);z-index:-1}
.fold-body{background:#f6f6f8!important;border-radius:16px!important;box-shadow:0 -1px 0 rgba(255,255,255,.9) inset,0 -6px 14px -10px rgba(0,0,0,.18),0 14px 30px -18px rgba(0,0,0,.18);padding:22px 20px 18px!important}
.polaroid{top:18px!important;right:22px!important;width:92px!important;padding:6px 6px 18px!important;transform:rotate(5deg)!important;box-shadow:0 10px 22px -8px rgba(0,0,0,.28)!important;z-index:3}
.fold:hover .polaroid{transform:rotate(2deg) translateY(-4px)!important}
.polaroid .ph{font-size:20px!important;background:#2a2a2f!important}
.fold:hover .fold-body{box-shadow:0 -1px 0 rgba(255,255,255,.9) inset,0 -6px 14px -10px rgba(0,0,0,.18),0 18px 36px -16px rgba(0,0,0,.24)}
.fold.add::before{background:none;border:1.5px dashed #c9c9d1}
.fold.add .fold-tab{display:none}
.fold.add .fold-body{background:none!important;box-shadow:none}
.ready{background:#fff!important;border-color:var(--line)!important}
.open{border-color:var(--line)!important}

/* ===== 폴더 v3: 앞판·뒷판 사이로 사진·종이가 나오는 폴더 ===== */
.fold2{--fb:#efeff2;--bk:#dedee3;position:relative;padding-top:70px;isolation:isolate;display:flex;flex-direction:column;min-width:0;text-align:left;font:inherit;color:var(--fg)}
.fold2.live{--fb:#ffe4ee;--bk:#ffc9dc}
.f2-back{position:absolute;left:0;right:0;top:22px;bottom:0;background:var(--bk);border-radius:20px;z-index:-3}
.f2-back::before{content:"";position:absolute;left:0;top:-12px;width:42%;height:30px;background:var(--bk);border-radius:14px 14px 0 0}
.f2-paper{position:absolute;left:9%;top:6px;width:44%;height:92px;background:#fff;border-radius:8px;transform:rotate(-7deg);z-index:-2;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:14px 14px 0;display:flex;flex-direction:column;gap:7px}
.f2-paper i{display:block;height:5px;border-radius:3px;background:#e4e4e8}
.f2-paper i:nth-child(1){width:70%}.f2-paper i:nth-child(3){width:50%}
.f2-photo{position:absolute;left:44%;top:0;width:38%;max-width:150px;aspect-ratio:4/3;background:#fff;padding:5px;border-radius:8px;transform:rotate(6deg);z-index:-1;box-shadow:0 4px 12px rgba(0,0,0,.14);transition:transform .2s}
.f2-photo img,.f2-photo span{display:grid;place-items:center;width:100%;height:100%;object-fit:cover;border-radius:5px;background:#2a2a2f;color:#fff;font-weight:800;font-size:18px;letter-spacing:-.04em}
.fold2:hover .f2-photo{transform:rotate(3deg) translateY(-6px)}
.f2-front{position:relative;flex:1;background:var(--fb);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 -4px 12px -6px rgba(0,0,0,.12)}
.f2-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.fold2 .tab-pill{background:#26262b;color:#fff}
.fold2 .tab-pill::before{background:var(--dot)}
.fold2.live .tab-pill::before{background:var(--brand)}
.fold2.prep .tab-pill::before{background:#fff}
.fold2.done .tab-pill::before{background:#8b8b92}
.f2-cnt{font-size:12px;color:var(--muted)}
.f2-front h3{font-size:19px;line-height:1.35;word-break:keep-all}
.f2-meta{font-size:13px;color:var(--sub)}
.f2-foot{display:flex;gap:8px;margin-top:auto;padding-top:16px}
.fold2 .ready{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.75)!important;border:0!important;font-size:13px;font-weight:700;white-space:nowrap}
.fold2 .ready .rl{color:var(--sub);font-weight:600}
.fold2 .ready i{flex:1;min-width:24px;height:5px;border-radius:3px;background:rgba(0,0,0,.1);overflow:hidden;display:block}
.fold2 .ready i b{display:block;height:100%;background:#26262b}
.fold2 .ready em{font-style:normal;font-size:12px;color:var(--sub)}
.fold2 .ready strong{margin-left:auto;font-size:15px}
.fold2 .open{height:42px;padding:0 14px;border-radius:12px;background:#26262b;color:#fff;border:0!important;display:inline-flex;align-items:center;font-weight:700;font-size:13px;white-space:nowrap}
.fold2.add{cursor:pointer;background:none;border:0;padding-left:0;padding-right:0}
.fold2.add .f2-back{background:none;border:1.5px dashed #c9c9d1}
.fold2.add .f2-back::before{display:none}
.fold2.add .f2-front{background:none;box-shadow:none;align-items:center;justify-content:center;text-align:center;color:var(--sub);min-height:170px}
.fold2.add .plus{width:44px;height:44px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:24px;margin:0 auto}
.fold2.add b{display:block;font-size:16px;color:var(--fg);margin-top:8px}
.fold2.add:hover .f2-front{background:var(--hover)}
.frame[data-device="mobile"] .f2-front h3{font-size:17px}
.frame[data-device="mobile"] .fold2.add .f2-front{min-height:110px}

.rh1{font-size:24px;margin-top:12px;display:flex;align-items:center;flex-wrap:wrap;gap:0 4px}

/* ===== 행사 화면 가독성: 면으로 구획 ===== */
.panel{background:#f6f6f8!important;border:0!important;border-radius:16px!important;padding:20px 22px!important}

.imoff{font-size:12px;color:var(--muted);white-space:nowrap}

.coinshop{margin-top:36px;border-top:1px solid var(--fg);padding-top:20px}
.cs-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

.cs-sub{font-size:14px;color:var(--sub);margin:4px 0 16px}
.packs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pack{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px;border-radius:14px;background:#f6f6f8;border:1.5px solid transparent;text-align:left}

.pk-n{font-size:20px;font-weight:800}
.pk-p{font-size:15px;font-weight:600}
.pk-u{font-size:12px;color:var(--muted)}
.pack em{position:absolute;top:12px;right:12px;font-style:normal;font-size:11px;font-weight:700;color:var(--brand)}

.pl-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pl-tx b{font-size:16px}
.pl-tx em{font-style:normal;color:var(--brand);font-weight:700}
.pl-tx small{font-size:13px;color:var(--muted)}

.pl-buy{min-width:104px;height:42px}
.pl-buy:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.thumbpick.top{gap:16px}
.pm-photo.big{width:120px;height:90px;font-size:13px;font-weight:600}
.dfld{position:relative}
.datebtn{height:42px;border:1px solid var(--line);border-radius:8px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;background:var(--bg);width:100%;text-align:left;font-variant-numeric:tabular-nums}

.datebtn svg{color:var(--muted);flex:none}
.datebtn[aria-expanded="true"]{border-color:var(--fg)}
.dfld.err .datebtn{border-color:var(--red)}
.calpop{position:absolute;left:0;top:calc(100% - 2px);z-index:40;width:300px;max-width:calc(100vw - 48px);background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 36px rgba(0,0,0,.14);padding:12px}

.cal-h select{flex:1;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font:inherit;font-size:14px;font-weight:600;background:var(--bg);cursor:pointer}
.cnav{width:34px;height:34px;border-radius:8px;font-size:20px;flex:none}
.cnav:hover{background:var(--hover)}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-w span{font-size:12px;color:var(--muted);padding:4px 0}

.cday.today{box-shadow:inset 0 0 0 1px var(--fg)}

.cal-f{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:8px;padding-top:8px}

.frame[data-device="mobile"] .pfoot{position:fixed!important;left:0;right:0;bottom:0;z-index:45;border:0!important;border-radius:20px 20px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.12);

.frame[data-device="mobile"] .pfoot::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:#d4d4d9}
.frame[data-device="mobile"] .pfoot .pbar{display:none}
.frame[data-device="mobile"] .pfoot .minibar{margin:0 0 12px}
.frame[data-device="mobile"] .popt h4{margin:0 0 8px}
.frame[data-device="mobile"] .popt-row{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
