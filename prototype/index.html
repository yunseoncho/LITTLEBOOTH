.frame[data-device="mobile"] .pbtns{margin-top:10px}

/* 1열 화면 읽기 편하게 */
.ovsum{display:flex;gap:8px;flex-wrap:wrap;padding:20px 0 4px}
.ovsum span{display:inline-flex;align-items:baseline;gap:6px;background:var(--hover);border-radius:999px;padding:7px 14px}
.ovsum small{font-size:12px;color:var(--sub)}
.ovsum b{font-size:14px}
.ovs h3{font-size:17px!important;margin-bottom:14px!important}
.ov-q{padding:2px 0;font-size:17px!important;font-weight:600;color:var(--fg)}
.irw{align-items:center!important;padding:10px 0!important}
.irw-l{display:flex;align-items:center;gap:12px;min-width:0}
.irw-th{width:40px;height:40px;flex:none;border-radius:10px;background:var(--hover);display:grid;place-items:center;overflow:hidden}
.irw-th img{width:100%;height:100%;object-fit:cover}
.irw-th svg{width:20px;height:20px;color:#2a2a2f}
.irw-t{display:flex;flex-direction:column;min-width:0}
.irw-t b{font-size:15px;font-weight:700;color:var(--fg)}
.irw-t small{font-size:12px;color:var(--muted)}
.irw-r{display:flex;align-items:center;gap:10px;color:var(--fg)!important}
.irw-r b{font-size:15px}
.irw-r em{font-style:normal;font-size:12px;font-weight:700;background:var(--hover);border-radius:999px;padding:3px 9px;color:var(--sub)}
.ovs .check label{font-size:15px}
.ovs .check input:checked+*,.ovs .check li:has(input:checked) label{color:var(--muted);text-decoration:line-through;text-decoration-color:#c4c4ca}
.ovs .notes li{grid-template-columns:52px minmax(0,1fr)!important;padding:12px 0!important}
.ovs .notes .k{display:inline-block;background:var(--brand-soft);border-radius:999px;padding:1px 8px;font-size:11px;margin-right:8px}
.ovl .rank li{padding:12px 0!important}
.ovs .prog{height:4px!important;border-radius:2px;background:#ececef!important}

/* 판매 순위 표 */
.rk-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.rk-tabs{display:flex;gap:4px}
.rk-tabs button{height:34px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--sub)}
.rk-tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.rk-t{border-top:1px solid var(--fg)}
.rk-h,.rk-r{display:grid;grid-template-columns:40px minmax(0,1.6fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.rk-h{font-size:12px;color:var(--sub);font-weight:600;padding:10px 0;border-bottom:1px solid var(--line)}
.rk-h span:nth-child(n+3),.rk-r>span:nth-child(n+3){text-align:right}
.rk-r{padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
.rk-r:nth-child(odd){background:none}
.rk-r>span:nth-child(n+3){display:flex;flex-direction:column;gap:3px}
.rk-r b{font-size:15px;font-weight:700}
.rk-n{font-size:15px;font-weight:800;color:var(--muted);padding-top:1px;text-align:center}
.rk-n.top{color:var(--brand)}
.rk-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.rk-name small{font-size:12px;color:var(--muted)}
.rk-bar2{display:block;height:4px;border-radius:2px;background:#ececef;margin-top:6px;max-width:220px}
.rk-bar2 i{display:block;height:100%;border-radius:2px;background:var(--fg)}
.rk-r:first-of-type .rk-bar2 i,.rk-h+.rk-r .rk-bar2 i{background:var(--brand)}
.rk-d{font-size:12px;color:var(--muted);font-weight:600}
.rk-d.up{color:var(--brand)}
.rk-d.dn{color:#6b6b72}
.rk-d.new{color:var(--fg)}
.rk-more{margin-top:10px}
.frame[data-device="mobile"] .rk-h,.frame[data-device="mobile"] .rk-r{grid-template-columns:28px minmax(0,1fr) 64px 92px;gap:8px}
.frame[data-device="mobile"] .rk-h span:nth-child(5),.frame[data-device="mobile"] .rk-r>span:nth-child(5){display:none}

.rk-pc{white-space:nowrap}
.frame[data-device="mobile"] .rk-pc{display:none}
.tc-wrap{position:relative}
.tc-svg{width:100%;height:auto;display:block;overflow:visible}
.tc-g{cursor:pointer;outline:none}
.tc-g:hover rect[fill="var(--fg)"],.tc-g:focus rect[fill="var(--fg)"]{fill:#3a3a40}
.ttip{position:absolute;z-index:5;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.1);padding:10px 12px;font-size:12px;display:flex;flex-direction:column;gap:5px;min-width:190px;pointer-events:none}
.ttip b{font-size:12px;color:var(--sub)}
.ttip span{display:flex;align-items:center;gap:6px;color:var(--sub)}
.ttip em{font-style:normal;font-weight:800;color:var(--fg);margin-left:auto;padding-left:12px}
.ttip i,.tc-leg i{display:inline-block;width:3px;height:12px;border-radius:2px}
.k1{background:var(--fg)} .k2{background:#c4c4ca}
.tc-leg{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--sub)}
.tc-leg span{display:inline-flex;align-items:center;gap:5px}
.tc-leg i{width:10px;height:10px}
.tc-leg i.k2.hour{height:0;border-top:2px dashed #a9a9b0;background:none}
.tc-leg small{color:var(--muted)}
.tc-cap{font-size:13px;color:var(--sub);margin:10px 0 0}
.tc-cap b{color:var(--brand)}
.frame[data-device="mobile"] .tc-leg small{display:none}

/* 판매 하단 정리: 옵션은 주문 줄 안으로 */
.lines .qtyrow{flex-wrap:wrap;gap:8px!important}
.lopts{display:flex;gap:6px;flex:1 1 auto;flex-wrap:wrap}
.lopt{height:34px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:12px;font-weight:600;color:var(--sub)}
.lopt span{color:var(--muted);font-weight:500}
.lopt[aria-pressed="true"]{border-color:var(--fg);color:var(--fg);background:var(--bg)}
.lopt[aria-pressed="true"] span{color:var(--sub)}
.pfoot{padding:10px 0 12px!important}
.pbtns{justify-content:flex-start!important;margin-top:0!important;gap:8px!important}
.pbtns .gb{height:40px!important;min-width:0!important;padding:0 14px!important;font-size:13px!important;border-radius:999px!important}
.pbtns .gb.visit i{font-size:12px;padding:1px 6px}
.frame[data-device="mobile"] .pfoot{padding-top:22px!important}
.frame[data-device="mobile"] .ptiles{padding-bottom:200px}

.rk-d em{font-style:normal;color:var(--fg);font-weight:800}
.rk-sum{border-bottom:0!important;border-top:1px solid var(--fg);background:var(--hover)!important;padding:12px 0!important}
.rk-sum b{font-size:14px}

.ttip[hidden]{display:none!important}
/* 개요 상단: 가설 + 블럭 */
.ovtop{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-top:20px;align-items:start}
.frame[data-device="mobile"] .ovtop{grid-template-columns:minmax(0,1fr)}
.gblk,.sblk{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.gb-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.gb-h h3{font-size:17px;font-weight:800;margin:0}
.gblk .ov-q{padding:0}
.goalf textarea{width:100%;border:1px solid var(--fg);border-radius:10px;padding:12px;font:inherit;font-size:15px;resize:vertical;background:var(--bg)}
.goalf-b{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
.gph{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.gph-i{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--bg)}
.gph-i img{width:100%;height:100%;object-fit:cover}
.gph-i button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1}
.gph-add{width:84px;height:84px;border-radius:10px;border:1.5px dashed #c4c4ca;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sub);cursor:pointer;background:var(--bg)}
.gph-add span{font-size:20px;line-height:1}
.gph-add small{font-size:12px}
.gph-add input{position:absolute;width:1px;height:1px;opacity:0}
.sb-h{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.sb-h b{font-size:17px;font-weight:800}
.sblk .check li,.sblk .notes li{border-color:var(--line)!important;font-size:15px}
.sblk .notes .k{display:inline-block;background:var(--brand-soft);border-radius:999px;padding:1px 8px;font-size:11px;margin-right:8px}
.sb-tabs{display:flex;gap:4px;margin:-4px 0 14px}
.sb-tabs button{height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--sub)}
.sb-tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.ovtop+.ovl{margin-top:8px}
/* 품목별 가로 바 */
.hbars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.hbars li{display:grid;grid-template-columns:96px minmax(0,1fr) 92px;gap:12px;align-items:center}
.hb-l{display:flex;flex-direction:column}.hb-l b{font-size:15px}.hb-l small{font-size:12px;color:var(--muted)}
.hb-t{height:14px;background:#ececef;border-radius:7px;overflow:hidden}
.hb-t i{display:block;height:100%;background:var(--fg);border-radius:7px}
.hb-t i.top{background:var(--brand)}
.hb-v{display:flex;flex-direction:column;align-items:flex-end}.hb-v b{font-size:15px}.hb-v small{font-size:12px;color:var(--muted)}
.frame[data-device="mobile"] .hbars li{grid-template-columns:64px minmax(0,1fr) 78px;gap:8px}
/* 소유자별 정산 */
.ost{display:flex;flex-direction:column}
.ost-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.ost-r:last-child{border-bottom:0}
.ost-n b{font-size:16px;display:block}.ost-n small{font-size:12px;color:var(--muted)}
.ost dl{margin:0;display:flex;flex-direction:column;gap:4px}
.ost dl div{display:flex;justify-content:space-between;font-size:14px;color:var(--sub)}
.ost dd{margin:0;color:var(--fg)}
.ost .ost-t{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;font-weight:800;color:var(--fg)}
.ost .ost-t dd{font-size:16px}
.frame[data-device="mobile"] .ost-r{grid-template-columns:minmax(0,1fr);gap:8px}
/* 회고 */
.retro{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:12px}
.retro li{display:grid;grid-template-columns:32px minmax(0,1fr) 24px;gap:10px;align-items:start}
.rt-av{width:32px;height:32px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:800}
.retro small{font-size:12px;color:var(--muted)}
.retro p{margin:2px 0 0;font-size:15px;line-height:1.6;background:var(--hover);border-radius:4px 14px 14px 14px;padding:10px 14px}
.rt-x{color:var(--muted);font-size:16px;opacity:0}
.retro li:hover .rt-x{opacity:1}
.rvf{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px}
.rvf:focus-within{border-color:var(--fg)}
.rvf textarea{flex:1;border:0;resize:none;font:inherit;font-size:15px;padding:6px 0;background:none;outline:none;min-height:24px}
/* 현장 로그 */
.flog{list-style:none;margin:0;padding:0;position:relative}
.flog li{display:grid;grid-template-columns:48px 14px minmax(0,1fr);gap:10px;align-items:start;padding:7px 0;font-size:15px;position:relative}
.flog li::before{content:"";position:absolute;left:64px;top:0;bottom:0;width:1px;background:var(--line)}
.flog li:first-child::before{top:14px}.flog li:last-child::before{bottom:calc(100% - 14px)}
.flog time{font-size:13px;color:var(--muted);padding-top:2px}
.flog i{width:9px;height:9px;border-radius:50%;background:#c4c4ca;margin:6px 0 0 3px;position:relative;z-index:1;box-shadow:0 0 0 3px var(--bg)}
.flog em{font-style:normal;font-size:11px;font-weight:700;color:var(--sub);background:var(--hover);border-radius:999px;padding:2px 8px;margin-right:8px}
.flog .fl-방문 i,.flog .fl-매출 i{background:var(--fg)}
.flog .fl-피크 i,.flog .fl-재고 i{background:var(--brand)}
.flog .fl-재고 em,.flog .fl-피크 em{color:var(--brand);background:var(--brand-soft)}
.flog .fl-메모 span,.flog .fl-공지 span{color:var(--sub)}

.cb-total{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cb-total small{font-size:13px;color:var(--sub)}
.cb-total b{font-size:26px;font-weight:800}
.cb-total span{font-size:13px;color:var(--muted)}
.cbar{display:flex;gap:2px;height:44px;border-radius:10px;overflow:hidden}
.cseg{display:flex;align-items:center;justify-content:center;min-width:6px;cursor:pointer;transition:filter .15s}
.cseg em{font-style:normal;font-size:13px;font-weight:800;color:#fff}
.cseg[style*="#c4c4ca"] em,.cseg[style*="#e2e2e6"] em{color:#1c1c20}
.cbar:hover .cseg:not(:hover){filter:opacity(.45)}
.cb-leg{list-style:none;margin:12px 0 0;padding:0;display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.cb-leg li{display:inline-flex;align-items:center;gap:6px}
.cb-leg i{width:10px;height:10px;border-radius:3px}
.cb-leg b{color:var(--fg)}

.rk-sum{background:var(--fg)!important;color:var(--bg);border:0!important;border-radius:14px;padding:16px 16px!important;margin-top:10px;align-items:end!important}
.rk-sum b{font-size:18px!important;font-weight:800;color:#fff}
.rk-sum small{font-size:12px;color:#a9a9b0!important;font-weight:600}
.rk-sum .rk-name small{color:#a9a9b0}
.rk-sum .rk-big{font-size:22px!important;color:#ff7aa8!important}
.rk-sum>span:first-child{display:none}
.rk-sum{grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr)!important}
.frame[data-device="mobile"] .rk-sum{grid-template-columns:minmax(0,1fr) 64px 92px!important}
.frame[data-device="mobile"] .rk-sum>span:nth-child(5){display:flex!important;grid-column:1/-1;flex-direction:row!important;justify-content:space-between;align-items:baseline;border-top:1px solid #3a3a40;padding-top:10px;margin-top:4px}

.flog li.fl-ph{grid-template-columns:auto auto 1fr;gap:8px;align-items:center;padding:16px 0 8px}
.flog li.fl-ph:first-child{padding-top:0}
.flog li.fl-ph::before{display:none}
.fl-pn{width:22px;height:22px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:12px;font-weight:800;display:grid;place-items:center}
.fl-ph b{font-size:15px;font-weight:800}
.fl-ph small{font-size:12px;color:var(--muted)}
.flog li:not(.fl-ph)+li.fl-ph{border-top:1px solid var(--line);margin-top:8px}
.flog .fl-시작 i,.flog .fl-종료 i{background:var(--brand);width:11px;height:11px;margin:5px 0 0 2px}
.flog .fl-시작 span,.flog .fl-종료 span{font-weight:700}
.flog .fl-시작 em,.flog .fl-종료 em{color:#fff;background:var(--brand)}
.flog .fl-만들기 i,.flog .fl-가설 i,.flog .fl-준비 i,.flog .fl-반입 i{background:#8e8e95}
.flog .fl-회고 span{color:var(--sub)}

.tc-g.tl .hv{opacity:0;transition:opacity .12s}
.tc-g.tl:hover .hv,.tc-g.tl:focus .hv{opacity:1}

/* QA 수정 */
.pt .st2{word-break:keep-all}
.ptabs [data-psearch]{position:sticky;right:0;background:var(--bg);box-shadow:-12px 0 12px var(--bg)}
.frame[data-device="tablet"] .ptabs>button,.frame[data-device="mobile"] .ptabs>button{padding:0 14px!important}

/* 로그인 */
.frame.auth-on .lnb,.frame.auth-on .tabbar,.frame.auth-on .hdr,.frame.auth-on .scrim{display:none!important}
.frame.auth-on #app{margin-left:0!important;padding:0!important}

.auth{width:100%;max-width:380px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:32px 28px;display:flex;flex-direction:column;gap:12px}
.auth-mark{font-size:20px;margin-bottom:8px}
.auth h1{font-size:22px;line-height:1.35;margin:0}
.auth-sub{font-size:14px;color:var(--sub);margin:-4px 0 8px}
.auth .fld input{height:46px}
.auth-err{font-size:13px;color:var(--brand);margin:0;font-weight:600}
.auth-go{height:48px;font-size:15px;width:100%;justify-content:center}
.auth-or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-note{font-size:12px;color:var(--muted);margin:4px 0 0;line-height:1.5}
.acct-w{position:relative}
.acct{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px 0 4px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:700}
.av-s{width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:800}
.frame[data-device="mobile"] .acct-n{display:none}
.frame[data-device="mobile"] .acct{padding:0 4px}
.acct-m{position:absolute;right:0;top:44px;z-index:80;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.1);padding:14px;min-width:200px;display:flex;flex-direction:column;gap:2px}
.acct-m[hidden]{display:none}
.acct-m b{font-size:15px}.acct-m small{font-size:12px;color:var(--muted);margin-bottom:8px}
.acct-m button{height:38px;border-radius:8px;text-align:left;padding:0 8px;font-size:14px;font-weight:600;border-top:1px solid var(--line)}
.acct-m button:hover{background:var(--hover)}

.stl3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stl3>div{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stl3 small{font-size:12px;color:var(--sub)}
.stl3 b{font-size:22px;font-weight:800}
.stl3 span{font-size:12px;color:var(--muted)}
.stl3 .k{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stl3 .k small,.stl3 .k span{color:#a9a9b0}
.stl-h{font-size:15px;margin:0 0 4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.stl-h small{font-size:12px;color:var(--muted);font-weight:500}
.frame[data-device="mobile"] .stl3{grid-template-columns:minmax(0,1fr)}

.ovs h3 .csvb{margin-left:auto;height:30px;padding:0 10px;font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:8px;color:var(--sub)}
.ovs h3 .csvb::before{content:"↓ "}
.ovs h3 .csvb:hover{border-color:var(--fg);color:var(--fg)}
.txl{list-style:none;margin:0;padding:0}
.txl>li{padding:12px 0;border-bottom:1px solid var(--line)}
.tx-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

const payMix = e => { const m={}; if(e.sales.length&&!Object.keys(e.base).length){ e.sales.forEach(x=>{ const k=x.pay; m[k]=m[k]||{amt:0,n:0}; m[k].amt+=x.total; m[k].n++; }); }
  else { const r=revenue(e), f=Object.keys(e.pay).length?e.pay:{카드:.6,현금:.3,이체:.1}; for(const k in f) m[k]={amt:Math.round(r*f[k]/100)*100,n:null}; } return m; };

function flow(e){

  return `<div class="flowbox">
    <ol class="flow" aria-label="운영 단계">${steps.map((s,i)=>`<li class="${i<idx||e.status==='done'?'ok':''} ${i===idx&&e.status!=='done'?'cur':''} ${i===1&&e.status==='live'?'live-now':''}"><i>${i<idx||e.status==='done'?'✓':i+1}</i>${s}</li>`).join('')}</ol>

function talkSend(id, text, withLedger){
  const c=chars[id], th=threads[id], step=c.steps[th.step]; if(!step||ui.typing) return;
  if(th.step>=1 && !th.unlocked){ toast('대화권을 쓰면 이어서 말할 수 있어요'); return; }
  const at=nowKST(), l=ledgerEv();
  th.msgs.push({from:'me',t:text,at});
  if(withLedger) th.msgs.push({from:'att',title:l.title,rev:won(revenue(l)),ord:orders(l)+'건',vis:visTxt(l),at});
  const replies = step.them(); th.step++;
  ui.typing=id; renderTalk();
  let i=0;
  const next=()=>{ th.msgs.forEach(m=>{ if(m.from!=='them') m.read=true; }); th.msgs.push({from:'them',t:replies[i++],at:nowKST()});
    if(i<replies.length){ renderTalk(); setTimeout(next,850); } else { ui.typing=null; renderTalk(); } };
  setTimeout(next,1000);
}
function renderTalk(){ if(location.hash.startsWith('#talk')){ route(); } }

  else if(d.qr){ const id=location.hash.slice(6), st=chars[id]?.steps[threads[id].step]; if(st) talkSend(id, st.me, !!st.ledger); }
  else if(d.quick&&e){e.notes.push({at:nowKST(),k:'기록',t:d.quick});ui.memoOpen=false;route();toast('메모를 남겼어요');}
  else if(d.checkout&&e){checkout(e);}
  else if(d.toast){ev.preventDefault();toast(d.toast);}
  else if(b.id==='startOp'||b.id==='startOp2'){ e.status='live'; e.start=nowKST(); ui.tab[e.id]=1; ui.lines=[]; route(); toast('행사를 시작했어요 · 운영 중'); }
  else if(b.id==='endOp'){ ui.confirmEnd=true; route(); }
  else if(b.id==='endNo'){ ui.confirmEnd=false; route(); }
  else if(b.id==='endYes'){ e.status='done'; e.endAt=nowKST(); ui.confirmEnd=false; ui.tab[e.id]=2; ui.lines=[]; ui.payOpen=false; ui.memoOpen=false; frame.classList.remove('sheet'); route(); scroller().scrollTo(0,0); toast('행사를 종료했어요 · 결과·회고가 열렸어요'); }
  else if(b.id==='toInfo'){ ui.tab[e.id]=0; route(); scroller().scrollTo(0,0); }
  else if(b.id==='memoToggle'){ ui.memoOpen=!ui.memoOpen; route(); if(ui.memoOpen) setTimeout(()=>$('#memoIn')?.focus(),0); }
  else if(b.id==='clear'){ui.lines=[];ui.selLine=null;ui.discount=0;route();}
  else if(b.id==='visit'){e.visits++;route();toast('방문 +1');}
  else if(b.id==='openSheet'){frame.classList.add('sheet');}
  else if(b.id==='sheetClose'){frame.classList.remove('sheet');}
  else if(b.id==='reply'){ui.step++;route();}
  else if(b.id==='unlock'){ui.unlocked=true;route();toast('대화권 1개를 썼어요 (프로토타입)');}
});
function checkout(e){
  const lines=ui.lines; if(!lines.length) return;
  const agg={}; lines.forEach(l=>agg[l.pid]=(agg[l.pid]||0)+l.q);
  const items=Object.entries(agg).map(([id,q])=>({id,q}));
  const base=items.reduce((a,i)=>a+P(i.id).price*i.q,0), extra=lines.reduce((a,l)=>a+lineExtra(l)*l.q,0), sub=base+extra, disc=Math.min(ui.discount,sub), tot=sub-disc;
  const cash=+ui.cashIn||0, change=ui.pay==='현금'&&cash>=tot?cash-tot:0;
  const opts={}; lines.forEach(l=>l.opts.forEach(n=>opts[n]=(opts[n]||0)+l.q));
  const _n=new Date(Date.now()+9*3600e3).toISOString(); e.sales.push({items,opts,discount:disc,extra,total:tot,pay:ui.pay,type:ui.otype,time:nowKST(),at:_n.slice(0,10)+' '+_n.slice(11,19)});
  ui.lines=[];ui.selLine=null;ui.discount=0;ui.discOpen=false;ui.payOpen=false;ui.cashIn='';frame.classList.remove('sheet');route();
  toast(`${won(tot)} ${ui.pay} 결제를 기록했어요${change?` · 거스름돈 ${won(change)}`:''}`);
}

  if(t.id==='pdPhoto' && t.files[0] && ui.pd){ const r=new FileReader(); r.onload=()=>{ ui.pd.photo=r.result; route(); }; r.readAsDataURL(t.files[0]); return; }

  if('caly' in t.dataset){ ui.cal.y=+t.value; route(); return; }

 const c=ev.target.closest('[data-ck]'); const e=curEvent(); if(c&&e){ e.checklist[+c.dataset.ck].d=c.checked; route(); } });

 if(ev.target.id==='loginForm'){ const id=$('#lgId').value.trim(), pw=$('#lgPw').value; ui.lgId=id;

function tcTip(ev){ const g=ev.target.closest&&ev.target.closest('.tc-g'); const wrap=ev.target.closest&&ev.target.closest('.tc-wrap'); document.querySelectorAll('.tc-wrap .ttip').forEach(t=>{ if(!wrap||t.parentNode!==wrap) t.hidden=true; });
  if(!g||!wrap) return; const t=wrap.querySelector('.ttip'); t.innerHTML=g.dataset.tip; t.hidden=false; const wr=wrap.getBoundingClientRect(), gr=g.getBoundingClientRect(); let x=gr.left-wr.left+gr.width/2+12; if(x+t.offsetWidth>wr.width) x=gr.left-wr.left+gr.width/2-12-t.offsetWidth; t.style.left=Math.max(0,x)+'px'; t.style.top=g.classList.contains('cseg')?(gr.bottom-wr.top+8)+'px':'4px'; if(g.classList.contains('cseg')){ let l=gr.left-wr.left+gr.width/2-t.offsetWidth/2; t.style.left=Math.max(0,Math.min(wr.width-t.offsetWidth,l))+'px'; } }
document.addEventListener('mouseover',tcTip); document.addEventListener('focusin',tcTip); document.addEventListener('click',e=>{ if(e.target.closest&&e.target.closest('.tc-g')) tcTip(e); });
